[package]
name        = "websocket-nv"
version     = "0.1.0"
description = "The socket half of WebSocket, over websocket-codec-nv: the RFC 6455 upgrade handshake on both sides over http-codec-nv, a connection value with typed send and receive, reassembly limits, automatic ping answering, the close handshake with its two deadlines, permessage-deflate over flate-nv, and the accept-loop shape a server takes."
license     = "Apache-2.0"

stability   = "experimental"

# Host. `wstrans` dials and listens, which costs `[io, net]` through
# `std.net` and `[net]` through `std.tls`. `wsconn.now_ms` reads a clock and
# is the only function that declares `[time]`. The options, the deflate
# negotiation, the close-handshake arithmetic and the accept policy declare
# no effect, because a connection is a value and the loop that drives it
# belongs to the caller.
#
# The driving functions are effect-polymorphic: `pump<T: WsTransport[e]>`
# costs whatever the caller's transport costs. A program that terminates TLS
# elsewhere, or speaks WebSocket over a unix socket, supplies its own
# transport and pays for nothing it does not use.
layer       = "host"

category    = "networking"

tags        = ["websocket", "rfc6455", "client", "server", "upgrade", "permessage-deflate", "tls"]
repository  = "https://github.com/novolang/websocket-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.22.0"

# A library: it has no `main`, so `novo pkg build` checks every module under
# `src/` and writes no binary.

[docs.pages]
"README.md" = "WebSocket with a socket under it"

[dependencies]
# Every frame this package puts on a wire is built by the codec, and every
# frame it reads is decoded there.
websocket-codec-nv = "^0.1.0"

# The handshake is an HTTP/1.1 exchange (RFC 6455 section 4), and the
# signatures name `H1Request` and `H1Response`.
http-codec-nv = "^0.1.0"

# permessage-deflate (RFC 7692). The negotiation and the four trailing bytes
# are this package's, and the DEFLATE is flate-nv's, in raw mode with no zlib
# header.
flate-nv = "^0.1.0"
